# Switch the default output to Bluetooth headphones when they connect.
#
# The Live EQ (quickshell/music/equalizer.sh) used to be the default sink and
# its output simply followed the highest-priority device, which is what made
# the AirPods take over on connect. The EQ is a smart filter now and the real
# device is the default, so this does that job explicitly.
# The script lives in ~/.local/share/wireplumber/scripts/ (dot-local/ in this
# repo): WirePlumber 0.5 only looks for scripts in data dirs, not ~/.config.

wireplumber.components = [
  {
    name = bluetooth-switch-on-connect.lua, type = script/lua
    provides = custom.bluetooth-switch-on-connect
  }
  # An "optional" feature is only loaded when something wants it, and making
  # the script itself "required" would let a broken script take the whole audio
  # stack down. A required virtual feature that merely wants it does neither.
  {
    type = virtual, provides = custom.policy.bluetooth-switch-on-connect
    wants = [ custom.bluetooth-switch-on-connect ]
  }
]

wireplumber.profiles = {
  main = {
    custom.policy.bluetooth-switch-on-connect = required
  }
}
