# Keep Bluetooth headsets in A2DP.
#
# WirePlumber's default policy (bluetooth.autoswitch-to-headset-profile = true,
# see the schema in /usr/share/wireplumber/wireplumber.conf) flips a headset to
# HFP/mSBC the moment any application opens its microphone. On AirPods that
# drops output to 16 kHz mono, which is what makes joining a voice call sound
# like the headphones broke.
#
# With this off the AirPods stay in hi-fi A2DP permanently. The tradeoff is
# that they are no longer offered as a *microphone* — calls use the built-in
# mic instead. Delete this file (and restart wireplumber) to get the old
# behaviour back.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
