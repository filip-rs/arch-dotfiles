#hypridle.conf
#
# The Lua config wraps `hyprctl dispatch <arg>` as `hl.dispatch(<arg>)`, so
# dispatches must be written as Lua (`hl.dsp.dpms(...)`). The old
# `hyprctl dispatch dpms off` form fails with a parse error.

general {
    lock_cmd = ~/.config/quickshell/lock/lock.sh   # single-instance itself; falls back to hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend, via lock_cmd's guard.
    # Screens may have been off (DPMS) when the machine went to sleep.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Hold suspend until the compositor confirms the lock (hyprland-lock-notify).
    # The default (2) only does that when lock_cmd mentions hyprlock.
    inhibit_sleep = 3
}

# 5 min: lock and turn the screens off.
listener {
    timeout = 300
    # One on-timeout per listener: a second key replaces the first
    on-timeout = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min: suspend, on battery only. systemd-ac-power reports AC when there is no
# battery at all, so this never fires on the desktop.
listener {
    timeout = 900
    on-timeout = systemd-ac-power || systemctl suspend
}
