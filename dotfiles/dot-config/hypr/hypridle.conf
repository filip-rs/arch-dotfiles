#hypridle.conf
general {
    lock_cmd = ~/.config/quickshell/lock/lock.sh   # single-instance itself; falls back to hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend, via lock_cmd's guard.
    # Hold suspend until the compositor confirms the lock (hyprland-lock-notify).
    # The default (2) only does that when lock_cmd mentions hyprlock.
    inhibit_sleep = 3
  # to avoid having to press a key twice to turn on the display.
}

# listener {
#     timeout = 300  
#     on-timeout = hyprlock
#     on-resume = hyprctl dispatch dpms on
# }

listener {
    timeout = 300
    # One on-timeout per listener: a second key replaces the first
    on-timeout = loginctl lock-session; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

