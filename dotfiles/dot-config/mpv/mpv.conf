# Decode video on the GPU. mpv's default is the CPU, which costs more battery
# than watching the same video in the browser.
hwdec=auto

# YouTube/yt-dlp: no more than the laptop's 1200p panel, with Opus audio.
# Plain "bestaudio" picks the 5.1 AAC track, which YouTube answers with a 403.
ytdl-format=bv*[height<=1200]+ba[acodec=opus]/bv*[height<=1200]+ba/b
