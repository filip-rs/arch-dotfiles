general {
    lock_cmd = pidof hyprlock || hyprlock
    # Go through logind so lock_cmd's pidof guard applies (no stacked hyprlocks)
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    # One on-timeout per listener: a second key replaces the first
    on-timeout = loginctl lock-session; niri msg action power-off-monitors
}
